name: CI/CD

on:
  push:
    tags:
      - v*
      - desktop/v*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

# cSpell:words sccache dtolnay houseabsolute softprops msvc

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shouldRelease: ${{ steps.compute_variables.outputs.shouldRelease }}
      appVersion: ${{ steps.compute_variables.outputs.appVersion }}
      cdCliMatrix: ${{ steps.compute_variables.outputs.cdCliMatrix }}
      cdTauriMatrix: ${{ steps.compute_variables.outputs.cdTauriMatrix }}
      rustVersion: ${{ steps.compute_variables.outputs.rustVersion }}
      releaseVersion: ${{ steps.compute_variables.outputs.releaseVersion }}
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          # https://github.com/jlumbroso/free-disk-space/blob/main/README.md#typical-output
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Mozilla-Actions/sccache-action@v0.0.4
      - run: bun install --frozen-lockfile
      - name: Compute variables
        uses: actions/github-script@v7
        id: compute_variables
        with:
          script: (await import('${{ github.workspace }}/.github/scripts/computeVariables.mjs')).default(context, core)
      - name: Install Tauri system dependencies
        uses: ./.github/actions/tauri-install-system-deps
      - name: Lint & Test
        run: bun run ci
      # - uses: EmbarkStudios/cargo-deny-action@v1
      #   with:
      #     rust-version: ${{ format('{0}.0', steps.compute_variables.outputs.rustVersion) }}
      #     command: check bans licenses sources

  cd-cli:
    timeout-minutes: 60
    needs: [ci]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.ci.outputs.cdCliMatrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: bun protoc
      - name: Install Linux protoc dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: apt-get update && apt-get install -y libclang-dev
      - name: Override version
        shell: bash
        run: |
          if "$(uname -s)" = "Darwin"; then
            SED="sed -i ''"
          else
            SED="sed -i"
          fi
          $SED -E 's/^version = ".+"$/version = "${{ needs.ci.outputs.releaseVersion }}"/' Cargo.toml
      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          target: ${{ matrix.target }}
          args: '--locked --release'
          working-directory: ./apps/cli/
      - run: |
          if [[ '${{ matrix.platform }}' == windows* ]]; then
            mv 'target/${{ matrix.target }}/release/exoshell.exe' 'cli-${{ matrix.target }}.exe'
          else
            mv 'target/${{ matrix.target }}/release/exoshell' 'cli-${{ matrix.target }}'
          fi
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: 'cli-${{ matrix.target }}'
          path: |
            cli-${{ matrix.target }}.exe
            cli-${{ matrix.target }}

  cd-tauri:
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.ci.outputs.cdTauriMatrix) }}
    runs-on: ${{ matrix.platform}}
    timeout-minutes: 60
    needs: [ci]
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: bun protoc
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.ci.outputs.rustVersion }}
          targets: ${{ matrix.rustTargets || matrix.tauriBuildTarget }}
      - uses: Mozilla-Actions/sccache-action@v0.0.4
      - run: bun install --frozen-lockfile
      - name: Install Tauri system dependencies
        uses: ./.github/actions/tauri-install-system-deps
      - name: Generate Typescript types from Rust
        run: bun run gen:types
      - name: Inject app version in Cargo.toml
        run: sed -i=bak 's/version = "0.0.0"/version = "${{ needs.ci.outputs.appVersion }}"/' Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./apps/desktop
          appVersion: ${{ needs.ci.outputs.appVersion }}
          tauriScript: bun tauri
          args: ${{ format('--target {0}', matrix.tauriBuildTarget) }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.tauriBuildTarget }}
          path: |-
            ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '
            ') }}
          if-no-files-found: error

  cd-browser-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ci]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - working-directory: apps/browser
        run: |
          J="$(jq '.version = "${{ needs.ci.outputs.appVersion }}"' package.json)"
          echo "$J" > package.json
          bun run build
        env:
          VERSION_NAME: ${{ needs.ci.outputs.releaseVersion }}
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: |
            apps/browser/.output/exoshell-*.zip
          if-no-files-found: error
          include-hidden-files: true

  release:
    if: needs.ci.outputs.shouldRelease != 'false'
    needs: [ci, cd-cli, cd-tauri, cd-browser-extensions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: bun
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: desktop/
          pattern: desktop-**
      - uses: actions/download-artifact@v4
        with:
          path: cli/
          pattern: cli-**
      - uses: actions/download-artifact@v4
        with:
          path: apss/browser/.output/
          pattern: exoshell-*.zip
      - name: Prepare release
        uses: actions/github-script@v7
        with:
          script: (await import('${{ github.workspace }}/.github/scripts/prepareRelease.mjs')).default(context, 'v${{ needs.ci.outputs.releaseVersion }}')
      - uses: softprops/action-gh-release@v2
        with:
          name: ExoShell v${{ needs.ci.outputs.releaseVersion }}
          draft: ${{ needs.ci.outputs.shouldRelease == 'draft' }}
          prerelease: ${{ needs.ci.outputs.shouldRelease == 'prerelease' || needs.ci.outputs.shouldRelease == 'draft' }}
          files: |
            updater.json
            desktop/**/*.tar.gz
            desktop/**/*.tar.gz.sig
            desktop/**/*.dmg
            desktop/**/*.deb
            desktop/**/*.AppImage
            desktop/**/*.msi
            desktop/**/*.exe
            desktop/**/*.zip
            desktop/**/*.zip.sig
            cli/**/*
            apps/browser/.output/*.zip
          # fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: ${{ needs.ci.outputs.shouldRelease == 'stable' && 'true' || 'false' }}
      - name: Publish browser extensions
        working-directory: apps/browser
        run: bun run release
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_PUBLISH_TARGET: ${{ secrets.CHROME_PUBLISH_TARGET }}
          CHROME_SKIP_SUBMIT_REVIEW: ${{ secrets.CHROME_SKIP_SUBMIT_REVIEW }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
